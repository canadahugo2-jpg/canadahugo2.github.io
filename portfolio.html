    <style>
        /* --- 1. BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; font-family: 'Helvetica Neue', Arial, sans-serif; padding: 40px 20px; }

        /* Título o Botón de volver (opcional) */
        .nav-back { margin-bottom: 40px; text-align: center; }
        .nav-back a { color: rgba(255,255,255,0.5); text-decoration: none; text-transform: uppercase; letter-spacing: 4px; font-size: 12px; transition: 0.3s; }
        .nav-back a:hover { color: #fff; }

        /* --- 2. EL MOSAICO (MASONRY) --- */
        .gallery {
            /* Definimos el número de columnas */
            column-count: 3; 
            column-gap: 15px; /* Espacio entre columnas */
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 15px; /* Espacio vertical entre fotos */
            overflow: hidden; /* Para que el zoom no se salga del borde */
            background: #111;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* Efecto suave */
        }

        /* --- 4. AJUSTE PARA MÓVIL --- */
        @media (max-width: 1024px) {
            .gallery { column-count: 2; } /* 2 columnas en tablets */
        }

        @media (max-width: 600px) {
            .gallery { column-count: 1; } /* 1 columna en móviles para ver bien las fotos */
            body { padding: 20px 10px; }
        }
        .gallery-item {
    width: 100%;
    height: 100%; /* Asegura que todos los contenedores sean iguales */
    overflow: hidden;
}

.video-container {
    position: relative;
    padding-bottom: 56.25%; /* Esto mantiene la proporción 16:9 de Vimeo */
    height: 0;
}

.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover; /* Esto es clave: hace que el video se adapte */
}
/* 1. Preparamos el contenedor para que pueda crecer suavemente */
.gallery-item {
    transition: transform 0.4s ease, box-shadow 0.4s ease !important;
    position: relative;
    overflow: hidden; /* Esto es vital: corta el contenido si se sale */
}

/* 2. El zoom: Solo agranda la cuadrícula (el marco) */
.gallery-item:hover {
    transform: scale(1.05) !important;
    z-index: 100 !important;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
}

/* 3. Bloqueo: Evita que la imagen o video interior hagan zoom */
.gallery-item img, 
.gallery-item iframe {
    transform: none !important; /* Fuerza al contenido a quedarse estático */
    transition: none !important; /* Quita cualquier transición previa que pueda molestar */
}

/* --- AJUSTE PARA MÓVIL REPARADO (SIN CORTES) --- */
@media (max-width: 767px) {
    .gallery {
        column-count: 2 !important; 
        column-gap: 15px !important; 
        padding: 15px !important;
        display: block !important; 
    }

    .gallery-item {
        break-inside: avoid !important; 
        display: inline-block !important;
        width: 100% !important;
        margin-bottom: 15px !important; 
    }

    /* Esta es la clave: Si el item tiene un iframe (video), le damos altura */
    .gallery-item:has(iframe) {
        aspect-ratio: 16 / 9 !important; /* Ajusta a 4/3 si tus videos son cuadrados */
        background: black; /* Evita destellos blancos mientras carga */
    }

    .gallery-item img {
        height: auto !important; 
        width: 100% !important;
        display: block !important;
        object-fit: contain !important;
    }

    .gallery-item iframe {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
    }

    </style>
