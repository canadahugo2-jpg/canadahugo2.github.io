    <style>
        /* --- 1. BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; font-family: 'Helvetica Neue', Arial, sans-serif; padding: 40px 20px; }

        /* Título o Botón de volver (opcional) */
        .nav-back { margin-bottom: 40px; text-align: center; }
        .nav-back a { color: rgba(255,255,255,0.5); text-decoration: none; text-transform: uppercase; letter-spacing: 4px; font-size: 12px; transition: 0.3s; }
        .nav-back a:hover { color: #fff; }

        /* --- 2. EL MOSAICO (MASONRY) --- */
        .gallery {
            /* Definimos el número de columnas */
            column-count: 3; 
            column-gap: 15px; /* Espacio entre columnas */
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 15px; /* Espacio vertical entre fotos */
            overflow: hidden; /* Para que el zoom no se salga del borde */
            background: #111;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* Efecto suave */
        }

        /* --- 4. AJUSTE PARA MÓVIL --- */
        @media (max-width: 1024px) {
            .gallery { column-count: 2; } /* 2 columnas en tablets */
        }

        @media (max-width: 600px) {
            .gallery { column-count: 1; } /* 1 columna en móviles para ver bien las fotos */
            body { padding: 20px 10px; }
        }
        .gallery-item {
    width: 100%;
    height: 100%; /* Asegura que todos los contenedores sean iguales */
    overflow: hidden;
}

.video-container {
    position: relative;
    padding-bottom: 56.25%; /* Esto mantiene la proporción 16:9 de Vimeo */
    height: 0;
}

.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover; /* Esto es clave: hace que el video se adapte */
}
        /* Esto hace que el bloque entero crezca */
.gallery-item {
    transition: transform 0.4s ease, box-shadow 0.4s ease; /* Transición suave */
    position: relative; /* Necesario para que el z-index funcione */
}

/* El efecto al pasar el cursor */
.gallery-item:hover {
    transform: scale(1.05); /* El bloque entero se agranda un 5% */
    z-index: 10; /* Hace que el bloque pase "por encima" de los demás */
    box-shadow: 0 15px 30px rgba(0,0,0,0.4); /* Le da profundidad para que parezca que flota */
}
