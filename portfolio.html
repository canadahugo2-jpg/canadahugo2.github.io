<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Hugo Reta</title>
    <style>
        /* ESTILOS EXCLUSIVOS PARA TU PORTFOLIO - NO TOCAN EL RESTO DE LA WEB */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* Fondo negro puro */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            padding-bottom: 80px; /* Espacio limpio al final de la página */
        }

        /* CABECERA MINIMALISTA (Botón de volver arriba centrado como en tu imagen) */
        .portfolio-nav {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .back-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* CONTENEDOR PRINCIPAL DEL FEED (Ocupa casi toda la pantalla de ancho) */
        .portfolio-feed {
            width: 92%; /* Deja márgenes elegantes a los lados */
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 50px; /* Separación limpia entre un proyecto y otro */
        }

        /* FILA DE PROYECTO INDIVIDUAL (Uno por línea) */
        .project-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* CONTENEDOR DE LA PORTADA (Formato Panorámico Anamórfico de Cine 21:9) */
        .project-card {
            width: 100%;
            aspect-ratio: 21 / 9; /* Mucho más alargado que 16:9, formato puramente cinematográfico */
            overflow: hidden;
            position: relative;
            background-color: #0b0b0b;
        }

        /* Imágenes o vídeos de portada ocupando todo el espacio */
        .project-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Sutil efecto visual premium al pasar el ratón por encima */
        .project-card:hover .project-media {
            transform: scale(1.015);
        }

        /* Degradado oscuro sutil en la esquina superior para asegurar que el texto blanco se lea siempre */
        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* TIPOGRAFÍA EDITORIAL (Idéntica al estilo flotante del vídeo de referencia) */
        .project-info {
            position: absolute;
            top: 35px;
            left: 35px;
            z-index: 3;
            pointer-events: none;
            max-width: 80%;
        }

        .project-title {
            font-family: "Didot", "Playfair Display", "Georgia", serif; /* Tipografía Serif elegante */
            font-size: 24px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 0.01em;
            line-height: 1.2;
        }

        /* AJUSTES PERFECTOS PARA MÓVILES (Para que no quede una tira demasiado estrecha) */
        @media (max-width: 768px) {
            .portfolio-nav {
                padding: 35px 20px;
            }
            
            .portfolio-feed {
                width: 95%;
                gap: 30px;
            }

            .project-card {
                aspect-ratio: 16 / 7.5; /* Adaptación de proporción para pantallas verticales */
            }

            .project-info {
                top: 20px;
                left: 20px;
                max-width: 90%;
            }

            .project-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <nav class="portfolio-nav">
        <a href="index.html" class="back-link">← Back to Home</a>
    </nav>

    <main class="portfolio-feed">
        
        <article class="project-row">
            <div class="project-card">
                <video class="project-media" autoplay muted loop playsinline>
                    <source src="Colourgrading.mp4" type="video/mp4">
                </video>
                <div class="project-info">
                    <h2 class="project-title">The Art of Colourgrading — Fuerteventura</h2>
                </div>
            </div>
        </article>

        <article class="project-row">
            <div class="project-card">
                <img class="project-media" src="proyecto2.jpg" alt="Estudio Bruma">
                <div class="project-info">
                    <h2 class="project-title">Estudio Bruma — Primavera Sound — Pull & Bear</h2>
                </div>
            </div>
        </article>

        <article class="project-row">
            <div class="project-card">
                <img class="project-media" src="proyecto3.jpg" alt="Specialized">
                <div class="project-info">
                    <h2 class="project-title">Performance Core — Specialized Campaign</h2>
                </div>
            </div>
        </article>

        <article class="project-row">
            <div class="project-card">
                <img class="project-media" src="proyecto4.jpg" alt="Adidas">
                <div class="project-info">
                    <h2 class="project-title">Adidas Originals — Street Culture</h2>
                </div>
            </div>
        </article>

    </main>

</body>
</html>
