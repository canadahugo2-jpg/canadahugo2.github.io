<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        /* RESETEO TOTAL PARA ELIMINAR MÁRGENES Y ESPACIOS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* Fondo negro puro */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* CABECERA MINIMALISTA */
        .portfolio-nav {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background-color: #000000;
        }

        .back-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* FEED COMPLETAMENTE PEGADO (SIN MÁRGENES NI GAP) */
        .portfolio-feed {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0; /* Elimina cualquier separación vertical */
        }

        .project-row {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* CONTENEDOR PANORÁMICO DE CINE */
        .project-card {
            width: 100%;
            aspect-ratio: 21 / 9; /* Formato ultra panorámico */
            overflow: hidden;    /* Evita que la imagen se salga al ampliarse */
            position: relative;
            cursor: pointer;
        }

        /* CONTENIDO MULTIMEDIA */
        .project-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* EFECTO HOVER 1: AMPLIAR LIGERAMENTE LA IMAGEN EN SU PROPIO ESPACIO */
        .project-card:hover .project-media {
            transform: scale(1.03);
        }

        /* CAPA CON DEGRADADO NEGRO SUPERIOR REFORZADO */
        .project-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: flex-start; /* Alinea el contenido a la izquierda */
            align-items: flex-start;     /* Alinea el contenido arriba */
            padding: 35px;               /* Separación elegante desde los bordes */
            
            /* Degradado negro sólido arriba que se desvanece suavemente hacia el centro */
            background: linear-gradient(to bottom, 
                rgba(0, 0, 0, 0.75) 0%, 
                rgba(0, 0, 0, 0.4) 30%, 
                rgba(0, 0, 0, 0) 60%
            );
            
            opacity: 0; /* Oculto por defecto */
            transition: opacity 0.5s ease;
            z-index: 2;
        }

        /* EFECTO HOVER 2: MOSTRAR TEXTO Y DEGRADADOS */
        .project-card:hover .project-overlay {
            opacity: 1;
        }

        /* TIPOGRAFÍA EN MINÚSCULA ALINEADA ARRIBA A LA IZQUIERDA */
        .project-title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 0.25em;
            text-transform: lowercase; /* Todo forzado a minúsculas */
            text-align: left;          /* Alineado a la izquierda */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); /* Sombra extra al texto para legibilidad perfecta */
        }

        /* ADAPTACIÓN EN MÓVILES */
        @media (max-width: 768px) {
            .project-card {
                aspect-ratio: 16 / 7.5; /* Un pelín más alto en móviles */
            }
            .project-overlay {
                padding: 20px; /* Menos padding en pantallas pequeñas */
            }
            .project-title {
                font-size: 11px;
                letter-spacing: 0.2em;
            }
        }
    </style>
</head>
<body>

    <nav class="portfolio-nav">
        <a href="index.html" class="back-link">← Back to Home</a>
    </nav>

    <main class="portfolio-feed">

</body>
