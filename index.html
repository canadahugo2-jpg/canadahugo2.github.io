<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        /* CSS AUTO-CONTENIDO - NO AFECTA A NINGÚN OTRO ARCHIVO DE TU WEB */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        /* NAVEGACIÓN FIJA (Logo izquierda, botón minimalista derecha) */
        .portfolio-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 40px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
        }

        .portfolio-logo {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
        }

        /* Botón de dos líneas finas que vuelve al index */
        .portfolio-menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .portfolio-menu-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: #ffffff;
        }

        /* CONTENEDOR CON SCROLL IMANTADO (PANTALLA COMPLETA) */
        .portfolio-scroll-container {
            width: 100%;
            height: 100dvh; /* dvh clava la pantalla en móviles sin fallos de barra */
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none; /* Oculta barra en Firefox */
        }

        .portfolio-scroll-container::-webkit-scrollbar {
            display: none; /* Oculta barra en Chrome/Safari */
        }

        /* SECCIONES VERTICALES RECTANGULARES */
        .portfolio-page {
            position: relative;
            width: 100%;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow: hidden;
        }

        /* Ajuste de clips y fotos estilo Cine (Edge-to-Edge) */
        .portfolio-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* TEXTO EDITORIAL (Tipografía Serif clásica como la referencia) */
        .portfolio-title-wrapper {
            position: absolute;
            top: 120px; 
            left: 40px;
            z-index: 10;
            max-width: 85%;
            pointer-events: none;
        }

        .portfolio-title {
            font-family: "Didot", "Playfair Display", "Georgia", serif; 
            font-size: 24px;
            font-weight: 400;
            line-height: 1.3;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.6);
        }

        /* ADAPTACIÓN MÉTRICA EXCLUSIVA PARA MÓVILES */
        @media (max-width: 768px) {
            .portfolio-header {
                padding: 20px;
            }

            .portfolio-logo {
                font-size: 11px;
                letter-spacing: 0.15em;
            }

            .portfolio-title-wrapper {
                top: 95px;
                left: 20px;
                max-width: 90%;
            }

            .portfolio-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <header class="portfolio-header">
        <a href="index.html" class="portfolio-logo">RETA</a>
        <button class="portfolio-menu-btn" onclick="window.location.href='index.html'" aria-label="Volver">
            <span></span>
            <span></span>
        </button>
    </header>

    <main class="portfolio-scroll-container">
        
        <section class="portfolio-page">
            <video class="portfolio-media" autoplay muted loop playsinline>
                <source src="Colourgrading.mp4" type="video/mp4">
            </video>
            <div class="portfolio-title-wrapper">
                <h2 class="portfolio-title">The Art of Colourgrading — Fuerteventura</h2>
            </div>
        </section>

        <section class="portfolio-page">
            <img class="portfolio-media" src="proyecto2.jpg" alt="Estudio Bruma">
            <div class="portfolio-title-wrapper">
                <h2 class="portfolio-title">Estudio Bruma — Primavera Sound — Pull & Bear</h2>
            </div>
        </section>

        <section class="portfolio-page">
            <img class="portfolio-media" src="proyecto3.jpg" alt="Specialized">
            <div class="portfolio-title-wrapper">
                <h2 class="portfolio-title">Performance Core — Specialized Campaign</h2>
            </div>
        </section>

        <section class="portfolio-page">
            <img class="portfolio-media" src="proyecto4.jpg" alt="Adidas">
            <div class="portfolio-title-wrapper">
                <h2 class="portfolio-title">Adidas Originals — Street Culture</h2>
            </div>
        </section>

    </main>

</body>
</html>
